{% extends "base.html" %}

{% block title %}
Register · PocketSmart AI
{% endblock %}


{% block content %}

<section class="auth-card">

  <p class="eyebrow">
    START PLANNING
  </p>

  <h1>
    Create account
  </h1>


  <form
    id="registerForm"
    class="form"
  >

    <label>

      Email

      <input
        name="email"
        type="email"
        required
      >

    </label>


    <label>

      Password

      <input
        name="password"
        type="password"
        minlength="8"
        required
      >

    </label>


    <button
      class="btn primary"
      type="submit"
    >
      Create account
    </button>


    <p
      id="formMessage"
      class="message"
    ></p>

  </form>


  <p>

    Already registered?

    <a href="/login">
      Sign in
    </a>.

  </p>

</section>

{% endblock %}
